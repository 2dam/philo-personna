services:
  - type: web
    name: mindset1000
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
